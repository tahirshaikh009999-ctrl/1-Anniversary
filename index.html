<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Museum of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0907;--gold1:#f0d68e;--gold2:#b68a45;--gold3:#6a4a1f;--text:#f4ebdd;--muted:#b9ab94;
    --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse at 50% 30%,#1f1912 0%,#0b0907 72%);color:var(--text);font-family:var(--sans);
    height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px 12px calc(8px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--gold1);outline-offset:3px}

  /* Intro ticket */
  #intro{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#17110b,#070504 75%);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center;transition:opacity 1.3s,visibility 1.3s}
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  .ticket{display:flex;width:min(560px,94vw);color:#2a1d0e;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7));animation:float 5s ease-in-out infinite}
  .t-main,.t-stub{background:linear-gradient(135deg,#f4ead2,#e3d3ae);position:relative}
  .t-main{flex:1;padding:30px 26px;border-radius:10px 0 0 10px;border-right:2px dashed rgba(90,60,20,.45)}
  .t-stub{width:26%;display:flex;align-items:center;justify-content:center;border-radius:0 10px 10px 0;padding:10px;font-family:var(--serif);font-size:1.05rem;line-height:1.2}
  .t-main::before,.t-main::after{content:"";position:absolute;right:-11px;width:20px;height:20px;border-radius:50%;background:#0c0906;z-index:2}
  .t-main::before{top:-10px}.t-main::after{bottom:-10px}
  .eyebrow{letter-spacing:.38em;font-size:.62rem;color:#8a6a35}
  .ticket h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,8vw,3rem);letter-spacing:.06em;margin:8px 0 2px}
  .ticket .names{font-family:var(--serif);font-style:italic;font-size:1.2rem}
  .ticket .sub{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#7a6542;margin-top:10px}
  @keyframes float{50%{transform:translateY(-6px) rotate(-.4deg)}}
  .btn{border:1px solid var(--gold2);color:var(--gold1);padding:14px 30px;letter-spacing:.22em;font-size:.76rem;text-transform:uppercase;transition:.3s;border-radius:2px}
  .btn:hover{background:var(--gold2);color:#150f08}
  .sound-note{color:var(--muted);font-size:.74rem;letter-spacing:.06em;margin-top:-18px}

  /* Stage */
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.96);transition:opacity 1.4s,transform 2.2s}
  #stage.show{opacity:1;transform:none}
  #scene{display:block;overflow:visible;filter:drop-shadow(0 28px 40px rgba(0,0,0,.85));pointer-events:none}
  .fh,.env,.clk{pointer-events:auto;cursor:pointer}
  .layer{transition:transform .35s ease-out}
  .fh,.vis{transform-box:fill-box;transform-origin:center;transition:transform .3s ease}
  .fh:hover,.fh:focus-visible{transform:scale(1.045)}
  .env:hover .vis,.env:focus-visible .vis,.clk:hover .vis,.clk:focus-visible .vis{transform:scale(1.08)}
  .fh:focus,.clk:focus,.env:focus{outline:none}
  .ring{opacity:0;transition:opacity .25s}
  .fh:focus-visible .ring{opacity:1}
  .lt{opacity:0}
  #scene.lit .lt{opacity:1;transition:opacity 3.2s ease .9s}
  .dk{opacity:.93}
  #scene.lit .dk{opacity:0;transition:opacity 3.4s ease .3s}
  .env .glow{animation:pulse 2.6s ease-in-out infinite}
  .env.seen .glow{animation:none;opacity:0}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.85}}

  .bar{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;opacity:0;transition:opacity 2s ease 3.4s}
  .bar.show{opacity:1}
  .hint{color:var(--muted);font-size:.74rem;text-align:center;letter-spacing:.03em}
  .bar button{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:7px 12px;border:1px solid #3a3228;margin:0 3px;border-radius:2px}
  .bar button:hover{color:var(--gold1);border-color:var(--gold2)}
  .bar #timeBtn{color:var(--gold1);border-color:var(--gold3);letter-spacing:.08em;text-transform:none;font-size:.74rem;font-variant-numeric:tabular-nums}

  /* Modal */
  #modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(5,4,3,.86);padding:14px;opacity:0;visibility:hidden;transition:.35s}
  #modal.open{opacity:1;visibility:visible}
  .sheet{width:100%;max-width:780px;max-height:88vh;max-height:88dvh;overflow:auto;background:#17120e;border:1px solid var(--gold3);border-radius:4px;
    display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 80px rgba(0,0,0,.8);transform:translateY(22px) scale(.97);transition:.45s ease}
  #modal.open .sheet{transform:none}
  .sheet .pic{min-height:340px;background:#2a211b center/cover no-repeat;background-image:var(--img,linear-gradient(135deg,#55402f,#1c1510));
    display:flex;align-items:center;justify-content:center;color:rgba(255,235,190,.5);font-family:var(--serif);font-size:1.3rem;padding:16px;text-align:center}
  .sheet .txt{padding:32px 28px;position:relative}
  .sheet .num{font-size:.64rem;letter-spacing:.32em;color:var(--gold2)}
  .sheet h2{font-family:var(--serif);font-weight:600;font-size:1.75rem;margin:10px 0 4px;color:var(--gold1);line-height:1.15;padding-right:24px}
  .sheet .date{font-size:.8rem;color:var(--muted);margin-bottom:16px}
  .sheet p{line-height:1.8;font-size:.98rem;white-space:pre-line}
  .close{position:absolute;top:8px;right:10px;font-size:1.8rem;color:var(--muted);padding:4px 10px}
  .close:hover{color:var(--gold1)}
  .sheet.letter{grid-template-columns:1fr;background:#efe6d2;color:#2c2218;max-width:560px}
  .sheet.letter .txt{padding:40px 36px}
  .sheet.letter h2{color:#6b4a1c}
  .sheet.letter p{font-family:var(--serif);font-size:1.22rem;line-height:1.7}
  .sheet.letter .num{color:#8a6a35}.sheet.letter .close{color:#6b5a40}.sheet.letter .date{color:#7a6542}
  #m-clock{display:none}
  .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 8px}
  .cell{background:rgba(255,255,255,.55);border:1px solid #cdb98f;border-radius:12px;text-align:center;padding:12px 4px 9px}
  .cell b{display:block;font-family:var(--serif);font-size:2rem;line-height:1;color:#6b4a1c;font-variant-numeric:tabular-nums}
  .cell span{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#8a6a35}
  .cd{margin-top:18px;padding-top:16px;border-top:1px dashed #b9a577;text-align:center}
  .cd small{display:block;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;color:#8a6a35;margin-bottom:6px}
  .cd strong{font-family:var(--serif);font-size:1.5rem;color:#6b4a1c;font-weight:600;font-variant-numeric:tabular-nums}
  .cd em{display:block;font-family:var(--serif);font-size:1.5rem;color:#a8302f}
  @media(max-width:640px){.sheet{grid-template-columns:1fr}.sheet .pic{min-height:210px;max-height:36vh}.sheet .txt,.sheet.letter .txt{padding:26px 20px}}

  /* List */
  #list{position:fixed;inset:0;z-index:55;background:#0e0c0a;overflow:auto;padding:34px 18px;display:none}
  #list.open{display:block}
  #list .wrap{max-width:720px;margin:0 auto}
  #list h2{font-family:var(--serif);font-weight:600;color:var(--gold1);font-size:2.1rem;margin-bottom:22px}
  #list article{border-top:1px solid #2c241b;padding:20px 0;display:grid;grid-template-columns:140px 1fr;gap:18px}
  #list .thumb{aspect-ratio:1;background:#2a211b center/cover;background-image:var(--img,linear-gradient(135deg,#55402f,#1c1510));border-radius:2px}
  #list h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--gold1);margin-bottom:4px}
  #list small{color:var(--muted)}
  #list p{margin-top:8px;line-height:1.7;white-space:pre-line}
  @media(max-width:620px){#list article{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>

<section id="intro" aria-label="Introduction">
  <div class="ticket">
    <div class="t-main">
      <div class="eyebrow">THE MUSEUM OF US · OPENING NIGHT</div>
      <h1>Admit Two</h1>
      <div class="names" id="tNames"></div>
      <div class="sub">Our first year, carefully kept</div>
    </div>
    <div class="t-stub"><span id="tStub">Valid<br>forever</span></div>
  </div>
  <button class="btn" id="enter">Enter our museum</button>
  <p class="sound-note" id="soundNote"></p>
</section>

<main id="stage"><svg id="scene" role="group" aria-label="A miniature museum of our memories" viewBox="0 0 1000 1240"></svg></main>

<div class="bar" id="bar">
  <p class="hint">Touch a frame to revisit a memory. The envelope holds a letter. The little clock keeps our time.</p>
  <div><button id="timeBtn" aria-label="Open our time together"></button><button id="musicBtn" aria-pressed="false">♪ Music off</button><button id="listBtn">View as list</button></div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet" id="sheet">
    <div class="pic" id="m-pic"></div>
    <div class="txt">
      <button class="close" id="close" aria-label="Close">&times;</button>
      <div class="num" id="m-num"></div><h2 id="m-title"></h2><div class="date" id="m-date"></div>
      <p id="m-story"></p><div id="m-clock"></div>
    </div>
  </div>
</div>

<div id="list" aria-label="All memories"><div class="wrap">
  <button class="btn" id="listClose" style="margin-bottom:26px">← Back to museum</button>
  <h2>Our collection</h2><div id="listItems"></div>
</div></div>
<audio id="bgm" loop preload="auto" playsinline></audio>

<script>
/* =====================================================================
   EDIT THIS SECTION ONLY
   ===================================================================== */
const CONFIG = {
  yourName: "[YOUR NAME]",
  herName: "[HER NAME]",
  startDate: "22 Nov 2025",              // shown on the plaque
  anniversaryDate: "22 Nov 2026",
  firstDate: "2025-11-22",               // the day it all started (YYYY-MM-DD) - drives the clock
  firstTime: "00:00",                    // optional: the time of the first date, e.g. "19:30" (24-hour)
  wallQuote: "Our love is the best exhibit.",
  photoTone: "none",                     // "none" | "warm" | "bw"
  /* MUSIC: put your song in an "audio" folder next to index.html and write its exact file name here.
     Example: "audio/our-song.mp3"   (use "" for no music). Only .mp3 or .m4a files, no YouTube/Spotify links. */
  music: "audio/our-song.mp3",
  musicVolume: 0.6,                      // 0 (silent) to 1 (full)
  letterTitle: "For when you have finished looking at the walls",
  letter:
`My love,

One year. I wanted to give you something that could hold all of it, so I built you a little museum.

Every frame on that wall is something I would keep forever. Every ordinary day with you turned out to be an exhibit I never wanted to take down.

Thank you for this first year. I'm so excited for everything still to come.

Always yours,
[YOUR NAME]`
};

/* kind: rect | oval | heart.  cx, cy = centre on the wall, w, h = frame size (scene is 1000 x 1240).
   img: "photos/01.jpg" ("" = placeholder).  pos: "top" | "center" | "bottom" (which part of the photo to keep). */
const MEMORIES = [
  {kind:"rect", cx:500,cy:250,w:190,h:140,rot:0,  num:"EXHIBIT 01", title:"The beginning of my favourite story",       date:"22 November 2025", img:"", pos:"center",
   story:"This is where it all started: our first date.\n\n[ADD YOUR MEMORY HERE]\n\nWrite what you remember and what you were thinking."},
  {kind:"oval", cx:262,cy:362,w:150,h:205,rot:-2, num:"EXHIBIT 02", title:"A day I would happily live again",           date:"[ADD DATE]", img:"", pos:"center", story:"[ADD YOUR MEMORY HERE]"},
  {kind:"oval", cx:738,cy:402,w:150,h:205,rot:2,  num:"EXHIBIT 03", title:"An ordinary moment, made extraordinary",     date:"[ADD DATE]", img:"", pos:"center", story:"[ADD YOUR MEMORY HERE]"},
  {kind:"heart",cx:500,cy:472,w:150,h:140,rot:0,  num:"EXHIBIT 04", title:"My favourite kind of adventure",             date:"[ADD DATE]", img:"", pos:"center", story:"[ADD YOUR MEMORY HERE]"},
  {kind:"rect", cx:272,cy:644,w:186,h:136,rot:1,  num:"EXHIBIT 05", title:"A little more like home",                    date:"[ADD DATE]", img:"", pos:"center", story:"[ADD YOUR MEMORY HERE]"},
  {kind:"rect", cx:730,cy:654,w:186,h:136,rot:-1, num:"EXHIBIT 06", title:"One year of choosing you",                   date:"[ADD DATE]", img:"", pos:"center", story:"[ADD YOUR MEMORY HERE]"},
  {kind:"heart",cx:500,cy:642,w:140,h:130,rot:0,  num:"EXHIBIT 07", title:"Reserved for what happens next",             date:"Still to come", img:"", pos:"center", future:true,
   story:"This collection is not complete.\n\nThere are still places to go, ordinary days to treasure, and so much more of us to come.\n\n[ADD A REAL PLAN OR PROMISE HERE]"}
];
/* ===================================================================== */

const $ = s => document.querySelector(s);
const letterText = () => CONFIG.letter.replace("[YOUR NAME]", CONFIG.yourName);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");

/* ---------------- geometry helpers ---------------- */
const HEART = (() => {
  const raw = [], n = 240;
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2;
    raw.push([16*Math.pow(Math.sin(t),3), -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]);
  }
  const xs = raw.map(p=>p[0]), ys = raw.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  return raw.map(p => [ (p[0]-x0)/(x1-x0)-.5, (p[1]-y0)/(y1-y0)-.5 ]);
})();

function poly(kind, w, h, ins){
  const W = Math.max(2, w-2*ins), H = Math.max(2, h-2*ins), pts = [];
  if (kind === "rect"){
    const hw=W/2, hh=H/2, s=4;
    for (let x=-hw; x<hw; x+=s) pts.push([x,-hh]);
    for (let y=-hh; y<hh; y+=s) pts.push([hw,y]);
    for (let x=hw; x>-hw; x-=s) pts.push([x,hh]);
    for (let y=hh; y>-hh; y-=s) pts.push([-hw,y]);
  } else if (kind === "oval"){
    for (let i=0;i<300;i++){ const a=i/300*Math.PI*2; pts.push([Math.sin(a)*W/2, -Math.cos(a)*H/2]); }
  } else {
    HEART.forEach(p => pts.push([p[0]*W, p[1]*H]));
  }
  return pts;
}
const pathD = (kind,w,h,ins) => "M" + poly(kind,w,h,ins).map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L") + "Z";

function resample(pts, gap){
  const out=[pts[0]]; let acc=0;
  for (let i=1;i<=pts.length;i++){
    const a=pts[i-1], b=pts[i%pts.length], d=Math.hypot(b[0]-a[0], b[1]-a[1]);
    acc += d;
    while (acc >= gap){ const k=(d-(acc-gap))/d; out.push([a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]); acc -= gap; }
  }
  return out;
}

function cluster(x,y,rot,s){
  let g = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${s.toFixed(2)})">`;
  [-66,-33,0,33,66].forEach(a => {
    g += `<ellipse cx="0" cy="-13" rx="5.4" ry="13" transform="rotate(${a})" fill="url(#gold)" stroke="#4d340f" stroke-width=".8"/>`;
  });
  g += `<circle r="6.5" fill="url(#bead)" stroke="#4d340f" stroke-width=".8"/></g>`;
  return g;
}

/* ---------------- ornate frame ---------------- */
function frameMarkup(m, i){
  const {kind,w,h} = m, mn = Math.min(w,h), t = mn*(kind==="heart"?.19:.17);
  const P = ins => pathD(kind,w,h,ins);
  let gold = `<path d="${P(0)}" fill="url(#gold)" stroke="#4d340f" stroke-width="1.4" stroke-linejoin="round"/>`;
  gold += `<path d="${P(t*.24)}" fill="none" stroke="#5b3d12" stroke-opacity=".75" stroke-width="2.4"/>`;
  gold += `<path d="${P(t*.31)}" fill="none" stroke="#fff0b8" stroke-opacity=".5" stroke-width="1"/>`;
  resample(poly(kind,w,h,t*.55), t*.30).forEach(p => {
    gold += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(t*.115).toFixed(2)}" fill="url(#bead)" stroke="#5b3d12" stroke-width=".5"/>`;
  });
  gold += `<path d="${P(t*.8)}" fill="#b98f3d" stroke="#4d340f" stroke-width="1.2" stroke-linejoin="round"/>`;
  gold += `<path d="${P(t*.93)}" fill="none" stroke="#f6dc94" stroke-opacity=".65" stroke-width="1"/>`;
  const s = t/21;
  if (kind === "rect"){
    const hw=w/2-t*.2, hh=h/2-t*.2;
    gold += cluster(-hw,-hh,-45,s)+cluster(hw,-hh,45,s)+cluster(hw,hh,135,s)+cluster(-hw,hh,-135,s);
    gold += cluster(0,-h/2+t*.1,0,s*.9);
  } else if (kind === "oval"){
    gold += cluster(0,-h/2+t*.1,0,s*1.2)+cluster(0,h/2-t*.1,180,s*1.1)+cluster(-w/2+t*.1,0,-90,s*.9)+cluster(w/2-t*.1,0,90,s*.9);
  } else {
    const c = HEART[0], tip = HEART[HEART.length/2];
    let li=0, ri=0; HEART.forEach((p,k)=>{ if(p[0]<HEART[li][0]) li=k; if(p[0]>HEART[ri][0]) ri=k; });
    gold += cluster(c[0]*w, c[1]*h + t*.1, 0, s*1.05) + cluster(tip[0]*w, tip[1]*h - t*.05, 180, s);
    gold += cluster(HEART[li][0]*w + t*.15, HEART[li][1]*h, -90, s*.9) + cluster(HEART[ri][0]*w - t*.15, HEART[ri][1]*h, 90, s*.9);
  }
  const al = {top:"xMidYMin", center:"xMidYMid", bottom:"xMidYMax"}[m.pos] || "xMidYMid";
  const tone = CONFIG.photoTone==="warm" ? ' filter="url(#toneWarm)"' : CONFIG.photoTone==="bw" ? ' filter="url(#toneBW)"' : '';
  let photo = `<clipPath id="cp${i}"><path d="${P(t)}"/></clipPath><g clip-path="url(#cp${i})">`;
  photo += `<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="url(#paper)"/>`;
  const fs = mn*.1;
  photo += m.future
    ? `<text y="${-fs*.2}" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-style="italic" font-size="${fs*1.25}" fill="#8a7550">Reserved</text><text y="${fs*1.2}" text-anchor="middle" font-family="Inter,Arial" font-size="${fs*.6}" letter-spacing="1.5" fill="#9b8a68">FOR WHAT'S NEXT</text>`
    : `<text y="${fs*.5}" text-anchor="middle" font-size="${fs*2.2}" fill="#b49c6e" opacity=".7">♥</text>`;
  if (m.img) photo += `<image href="${esc(m.img)}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" preserveAspectRatio="${al} slice"${tone} onerror="this.remove()"/>`;
  photo += `<path d="${P(t)}" fill="none" stroke="rgba(25,12,0,.65)" stroke-width="12"/>`;
  photo += `<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="url(#sheen)"/></g>`;
  const label = `${m.num}: ${m.title}`;
  return `<g transform="translate(${m.cx} ${m.cy}) rotate(${m.rot||0})" filter="url(#fshadow)">
    <g class="fh" tabindex="0" role="button" aria-label="${esc(label)}" data-i="${i}">
      <path class="ring" d="${P(-7)}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>
      <g filter="url(#bevel)">${gold}</g>${photo}
    </g></g>`;
}

/* ---------------- cute wall clock ---------------- */
function clockMarkup(){
  let ticks = "";
  for (let i=0;i<12;i++){
    const long = i%3===0;
    ticks += `<line x1="0" y1="${long?-25:-24}" x2="0" y2="-21.5" stroke="#5b3d12" stroke-width="${long?2:1}" stroke-linecap="round" transform="rotate(${i*30})"/>`;
  }
  const heart = "M0,4 C-8,-2 -6,-8 0,-5 C6,-8 8,-2 0,4Z";
  return `<g transform="translate(795 216)">
   <g class="clk" id="clock" tabindex="0" role="button" aria-label="Open the clock that keeps our time together">
    <circle r="44" fill="transparent"/>
    <g class="vis">
    <circle r="37" fill="rgba(50,30,8,.3)" transform="translate(5 9)" filter="url(#blur3)"/>
    <g filter="url(#bevel)"><circle r="36" fill="url(#gold)" stroke="#4d340f" stroke-width="1.2"/>
      <circle r="31" fill="none" stroke="#5b3d12" stroke-opacity=".7" stroke-width="1.5"/></g>
    <circle r="29" fill="#fbf5e6" stroke="#4d340f" stroke-width="1"/>
    <circle r="29" fill="url(#sheen)"/>
    ${ticks}
    <path d="${heart}" transform="translate(0 -13) scale(.55)" fill="#c9506a"/>

function person(x,y,o){
  const s=o.s||1, skin=o.skin||"#e2b796", bot=o.bot||"#2a2d36", hair=o.hair||"#2a1a12";
  let g = `<g transform="translate(${x} ${y}) scale(${s})">`;
  g += `<ellipse cx="0" cy="3" rx="28" ry="6.5" fill="rgba(30,16,4,.42)" filter="url(#blur3)"/>`;
  const shade = d => `<path d="${d}" fill="url(#fshade)"/>`;
  if (o.dress){
    g += `<rect x="-9" y="-34" width="7" height="31" fill="${skin}"/><rect x="2" y="-34" width="7" height="31" fill="${skin}"/>`;
    g += `<ellipse cx="-5.5" cy="-2" rx="7" ry="3.6" fill="#241a14"/><ellipse cx="5.5" cy="-2" rx="7" ry="3.6" fill="#241a14"/>`;
    const sk = "M-17,-96 L17,-96 L27,-30 Q0,-20 -27,-30 Z";
    g += `<path d="${sk}" fill="${o.dress}"/>${shade(sk)}`;
  } else {
    g += `<rect x="-12" y="-68" width="11" height="64" rx="2" fill="${bot}"/><rect x="1" y="-68" width="11" height="64" rx="2" fill="${bot}"/>`;

  }
  const bodiceBottom = o.dress ? -92 : -64;
  const tor = `M-20,-116 Q0,-123 20,-116 L${o.dress?17:19},${bodiceBottom} L${o.dress?-17:-19},${bodiceBottom} Z`;
  g += `<rect x="-30" y="-114" width="9.5" height="46" rx="4.5" fill="${o.top}" transform="rotate(3 -25 -114)"/>`;
  g += `<rect x="20.5" y="-114" width="9.5" height="46" rx="4.5" fill="${o.top}" transform="rotate(-3 25 -114)"/>`;
  g += `<circle cx="-26.5" cy="-66" r="4.6" fill="${skin}"/><circle cx="26.5" cy="-66" r="4.6" fill="${skin}"/>`;
  g += `<path d="${tor}" fill="${o.top}"/>${shade(tor)}`;
  g += `<rect x="-4.5" y="-126" width="9" height="11" fill="${skin}"/>`;
  g += `<circle cx="0" cy="-135" r="13.8" fill="${skin}"/>`;
  if (o.long) g += `<path d="M-15,-136 Q-16,-98 -9,-96 L9,-96 Q16,-98 15,-136 Z" fill="${hair}"/>`;

  return g + `</g>`;
}

/* ---------------- fit to screen ---------------- */
const svg = $("#scene"), stage = $("#stage");
function fit(){
  const W = stage.clientWidth, H = stage.clientHeight, r = 1000/1240;
  const w = Math.max(0, Math.min(W, H*r));
  svg.style.width = w + "px"; svg.style.height = (w/r) + "px";
}
new ResizeObserver(fit).observe(stage); addEventListener("resize", fit);

/* ---------------- our time ---------------- */
const START = (() => {
  const [y,m,d] = CONFIG.firstDate.split("-").map(Number);
  const [hh,mm] = (CONFIG.firstTime || "00:00").split(":").map(Number);
  return new Date(y, m-1, d, hh||0, mm||0, 0);
})();
function since(now){
  let y=now.getFullYear()-START.getFullYear(), mo=now.getMonth()-START.getMonth(), d=now.getDate()-START.getDate(),
      h=now.getHours()-START.getHours(), mi=now.getMinutes()-START.getMinutes(), s=now.getSeconds()-START.getSeconds();
  if (s<0){s+=60;mi--} if (mi<0){mi+=60;h--} if (h<0){h+=24;d--}
  if (d<0){d+=new Date(now.getFullYear(),now.getMonth(),0).getDate();mo--}
  if (mo<0){mo+=12;y--}
  return {y,mo,d,h,mi,s};
}
function nextAnniversary(now){
  let k = Math.max(1, now.getFullYear()-START.getFullYear());
  const mk = k => new Date(START.getFullYear()+k, START.getMonth(), START.getDate(), START.getHours(), START.getMinutes(), 0);
  while (mk(k) <= now) k++;
  return {k, t: mk(k)};
}
const ord = n => n + (["th","st","nd","rd"][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4] || "th");
function clockData(){
  const now = new Date(), s = since(now), nx = nextAnniversary(now);
  const ms = nx.t - now, cd = {d:Math.floor(ms/864e5), h:Math.floor(ms%864e5/36e5), m:Math.floor(ms%36e5/6e4), s:Math.floor(ms%6e4/1e3)};
  const days = Math.floor((now-START)/864e5);
  const isDay = now.getFullYear()>START.getFullYear() && now.getMonth()===START.getMonth() && now.getDate()===START.getDate();
  return {now,s,nx,cd,days,isDay};
}
function tick(){
  const c = clockData(), n = c.now;
  const hh = $("#hH"), mm = $("#hM"), ss = $("#hS");
  if (hh){
    hh.setAttribute("transform", `rotate(${((n.getHours()%12)+n.getMinutes()/60)*30})`);
    mm.setAttribute("transform", `rotate(${(n.getMinutes()+n.getSeconds()/60)*6})`);
    ss.setAttribute("transform", `rotate(${n.getSeconds()*6})`);
  }
  const s = c.s;
  $("#timeBtn").textContent = `♡ ${c.days} days ${pad(s.h)}h ${pad(s.mi)}m ${pad(s.s)}s together`;
  if (modal.classList.contains("open") && sheet.classList.contains("clockmode")) renderClock(c);
}
function renderClock(c){
  const s = c.s, cell = (v,l) => `<div class="cell"><b>${v}</b><span>${l}</span></div>`;
  const cd = c.cd;
  const next = c.isDay
    ? `<small>Today</small><em>Happy ${ord(c.nx.k-1)} anniversary ♥</em>`
    : `<small>Until our ${ord(c.nx.k)} anniversary</small><strong>${cd.d}d ${pad(cd.h)}h ${pad(cd.m)}m ${pad(cd.s)}s</strong>`;
  $("#m-clock").innerHTML = `<div class="cgrid">${cell(s.y,"years")}${cell(s.mo,"months")}${cell(s.d,"days")}${cell(pad(s.h),"hours")}${cell(pad(s.mi),"minutes")}${cell(pad(s.s),"seconds")}</div>
    <div style="text-align:center;font-family:var(--serif);font-size:1.05rem;color:#6b4a1c">${c.days.toLocaleString()} days since it all began</div>
    <div class="cd">${next}</div>`;
}

/* ---------------- start ---------------- */
svg.innerHTML = buildScene(); fit();
$("#tNames").textContent = `${CONFIG.yourName} & ${CONFIG.herName}`;
$("#soundNote").textContent = CONFIG.music ? "Best with sound 🎧 Music starts when you enter." : "";

/* ---------------- modal ---------------- */
const modal = $("#modal"), sheet = $("#sheet"); let lastFocus = null;
const posCss = {top:"center top", center:"center", bottom:"center bottom"};
function resetSheet(){
  sheet.classList.remove("letter","clockmode");
  $("#m-clock").style.display = "none"; $("#m-story").style.display = "";
  $("#m-pic").style.display = "flex"; $("#m-pic").style.removeProperty("--img");
}
function openMemory(m, trigger){
  lastFocus = trigger; resetSheet();
  const pic = $("#m-pic");
  if (m.img){ pic.textContent = ""; pic.style.setProperty("--img", `url("${m.img}")`); pic.style.backgroundPosition = posCss[m.pos] || "center"; }
  else pic.textContent = m.future ? "Reserved" : "Your photo goes here";
  $("#m-num").textContent = m.num; $("#m-title").textContent = m.title;
  $("#m-date").textContent = m.date; $("#m-story").textContent = m.story; show();
}
function openLetter(){
  const env = $("#env"); lastFocus = env; env.classList.add("seen"); resetSheet(); sheet.classList.add("letter");
  $("#m-pic").style.display = "none"; $("#m-num").textContent = "A LETTER";
  $("#m-title").textContent = CONFIG.letterTitle; $("#m-date").textContent = CONFIG.anniversaryDate;
  $("#m-story").textContent = letterText(); show();
}
function openClock(trigger){
  lastFocus = trigger || $("#clock"); resetSheet(); sheet.classList.add("letter","clockmode");
  $("#m-pic").style.display = "none"; $("#m-story").style.display = "none"; $("#m-clock").style.display = "block";
  $("#m-num").textContent = "OUR TIME TOGETHER"; $("#m-title").textContent = "Since the first date";
  $("#m-date").textContent = new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"long",year:"numeric"}).format(START);
  renderClock(clockData()); show();
}
function show(){ modal.classList.add("open"); sheet.scrollTop = 0; setTimeout(() => $("#close").focus(), 60); }
function hide(){ modal.classList.remove("open"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
$("#close").onclick = hide;
modal.addEventListener("click", e => { if (e.target === modal) hide(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (modal.classList.contains("open")) hide(); else if ($("#list").classList.contains("open")) closeList();
});
const bindBtn = (el, fn) => {
  el.addEventListener("click", fn);
  el.addEventListener("keydown", e => { if (e.key==="Enter" || e.key===" "){ e.preventDefault(); fn(); } });
};
svg.querySelectorAll(".fh").forEach(el => bindBtn(el, () => openMemory(MEMORIES[+el.dataset.i], el)));
bindBtn($("#env"), openLetter);
bindBtn($("#clock"), () => openClock($("#clock")));
$("#timeBtn").onclick = () => openClock($("#timeBtn"));

{ const c = clockData(); if (c.days > 0) $("#tStub").innerHTML = `Day<br><b style="font-size:1.7rem">${c.days}</b>`; }
tick(); setInterval(tick, 1000);

/* ---------------- music ---------------- */
const bgm = $("#bgm"), mb = $("#musicBtn");
let musicOn = false;
function setMusicUI(label){
  mb.textContent = label || (musicOn ? "♪ Music on" : "♪ Music off");
  mb.setAttribute("aria-pressed", String(musicOn));
}
async function playMusic(){
  try { await bgm.play(); musicOn = true; setMusicUI(); }
  catch (e) { musicOn = false; setMusicUI(bgm.error ? "♪ Audio file not found" : "♪ Tap to play music"); }
}
function pauseMusic(){ bgm.pause(); musicOn = false; setMusicUI(); }
if (CONFIG.music){
  bgm.src = encodeURI(CONFIG.music);
  bgm.loop = true; bgm.volume = CONFIG.musicVolume ?? 0.6;
  bgm.addEventListener("error", () => { musicOn = false; setMusicUI("♪ Audio file not found"); });
} else {
  mb.style.display = "none";
}
mb.onclick = () => musicOn ? pauseMusic() : playMusic();

/* ---------------- enter, light up ---------------- */
$("#enter").onclick = () => {
  if (CONFIG.music) playMusic();           /* the tap on "Enter" lets the browser start the music */
  $("#intro").classList.add("hide"); stage.classList.add("show");
  setTimeout(() => svg.classList.add("lit"), 400); $("#bar").classList.add("show");
};

/* ---------------- depth parallax (gentle) ---------------- */
const layers = [...svg.querySelectorAll(".layer")];
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
function shift(nx, ny){
  if (reduce) return;
  layers.forEach(l => { const d = +l.dataset.d; l.style.transform = `translate(${(-nx*d).toFixed(2)}px,${(-ny*d*.6).toFixed(2)}px)`; });
}
stage.addEventListener("pointermove", e => {
  const r = svg.getBoundingClientRect();
  shift((e.clientX-r.left)/r.width-.5, (e.clientY-r.top)/r.height-.5);
});
stage.addEventListener("pointerleave", () => shift(0,0));
addEventListener("deviceorientation", e => {
  if (e.gamma == null || e.beta == null) return;
  shift(Math.max(-1,Math.min(1,e.gamma/30))*.5, Math.max(-1,Math.min(1,(e.beta-45)/30))*.5);
});

/* ---------------- list view ---------------- */
function openList(){
  const box = $("#listItems"); box.innerHTML = "";
  const add = (title, meta, text, img) => {
    const a = document.createElement("article");
    const t = document.createElement("div"); t.className = "thumb"; if (img) t.style.setProperty("--img", `url("${img}")`);
    const d = document.createElement("div");
    const h = document.createElement("h3"); h.textContent = title;
    const s = document.createElement("small"); s.textContent = meta;
    const p = document.createElement("p"); p.textContent = text;
    d.append(h, s, p); a.append(t, d); box.appendChild(a);
  };
  MEMORIES.forEach(m => add(m.title, `${m.num} · ${m.date}`, m.story, m.img));
  add(CONFIG.letterTitle, "A letter", letterText(), "");
  $("#list").classList.add("open"); $("#listClose").focus();
}
function closeList(){ $("#list").classList.remove("open"); $("#listBtn").focus(); }
$("#listBtn").onclick = openList; $("#listClose").onclick = closeList;
</script>
</body>
