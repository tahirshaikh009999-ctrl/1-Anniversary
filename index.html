<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Museum of Us</title>
<meta name="theme-color" content="#0b0907">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="intro" aria-label="Introduction">
  <div class="ticket">
    <div class="t-main">
      <div class="eyebrow">THE MUSEUM OF US · OPENING NIGHT</div>
      <h1>Admit Two</h1>
      <div class="names" id="tNames"></div>
      <div class="sub">Our first year, carefully kept</div>
    </div>
    <div class="t-stub"><span id="tStub">Valid<br>forever</span></div>
  </div>
  <button class="btn" id="enter">Enter our museum</button>
  <p class="sound-note" id="soundNote"></p>
  <form id="gateForm" hidden autocomplete="off"><label for="gateIn" id="gateQ"></label><input id="gateIn" type="text" required><button class="btn" type="submit">Unlock</button><p id="gateErr" role="status"></p></form>
</section>

<canvas id="dust" aria-hidden="true"></canvas>
<main id="stage"><svg id="scene" role="group" aria-label="A miniature museum of our memories" viewBox="0 0 1000 1240"></svg></main>

<div class="bar" id="bar">
  <p class="hint">Touch a frame to revisit a memory. The envelope holds a letter. The little clock keeps our time. Use ← → to move between exhibits.</p>
  <div><button id="timeBtn" aria-label="Open our time together"></button><button id="musicBtn" aria-pressed="false">♪ Music off</button><button id="reasonBtn">♡ A reason why</button><button id="listBtn">View as list</button></div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet" id="sheet">
    <div class="pic" id="m-pic"></div>
    <div class="txt">
      <button class="close" id="close" aria-label="Close">&times;</button>
      <div class="num" id="m-num"></div><h2 id="m-title"></h2><div class="date" id="m-date"></div>
      <p id="m-story"></p><div id="m-clock"></div>
      <div class="nav" id="nav" hidden><button id="prev" aria-label="Previous exhibit">‹</button><span id="navCount"></span><button id="next" aria-label="Next exhibit">›</button></div>
      <div class="nav" id="againBox" hidden><button id="again">Another reason</button></div>
    </div>
  </div>
</div>

<div id="list" aria-label="All memories"><div class="wrap">
  <button class="btn" id="listClose" style="margin-bottom:26px">← Back to museum</button>
  <h2>Our collection</h2><div id="listItems"></div>
</div></div>
<audio id="bgm" loop preload="auto" playsinline></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
